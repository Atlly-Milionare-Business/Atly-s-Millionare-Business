<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altus Gear - Product</title>
    <meta name="description" content="Altus Gear cross-body bag — select your colour and quantity.">
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="icon" href="./assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-black': '#000000',
                        'brand-white': '#ffffff',
                        'brand-grey': '#f2f2f2',
                        'brand-accent': '#8a8a8a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .thumb.active { border-color: #000; }
        .color-dot.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #000; }
        .accordion-chevron { transition: transform 0.25s ease; }
        .accordion-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .add-to-cart-btn.added { background-color: #16a34a !important; border-color: #16a34a !important; color: #fff !important; }
        .add-to-cart-btn.added::before, .add-to-cart-btn.added::after { opacity: 0; }

        /* Diagonal-close hover: two slanted panels slide in from the
           sides and meet in the middle, then text/border flip color. */
        .diagonal-close {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            transition: color 0.15s ease 0.3s, border-color 0.15s ease 0.3s;
        }
        .diagonal-close::before,
        .diagonal-close::after {
            content: '';
            position: absolute;
            top: -15%;
            height: 130%;
            width: 60%;
            background: var(--diag-fill, #000);
            z-index: -1;
            transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.2s ease;
        }
        .diagonal-close::before {
            left: -20px;
            transform: translateX(-160%) skewX(-18deg);
        }
        .diagonal-close::after {
            right: -20px;
            transform: translateX(160%) skewX(-18deg);
        }
        .diagonal-close:hover:not(:disabled) {
            color: var(--diag-color, #fff);
            border-color: var(--diag-color, #fff);
        }
        .diagonal-close:hover:not(:disabled)::before,
        .diagonal-close:hover:not(:disabled)::after {
            transform: translateX(0) skewX(-18deg);
        }
        #add-to-cart:disabled, #buy-now:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: transparent !important;
            color: #000 !important;
            border-color: #000 !important;
        }
        #main-image { transition: opacity 0.2s ease; cursor: zoom-in; }
        .nav-current {
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 6px;
        }
        #zoom-modal { display: none; }
        #zoom-modal.open { display: flex; }
    </style>
</head>
<body class="font-sans bg-brand-white text-brand-black">

    <!-- Top Nav -->
    <nav class="sticky top-0 z-50 bg-brand-white border-b border-black/10">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-4 sm:px-6 py-4">
            <a href="index.html" class="flex items-center space-x-3">
                <img src="./assets/logo-mark.png" alt="Altus Gear Logo" class="w-8 h-8 object-contain invert">
                <span class="text-lg font-serif tracking-widest uppercase hidden md:block">ALTUS GEAR</span>
            </a>
            <div class="flex items-center space-x-6 sm:space-x-8 text-sm tracking-wider font-light">
                <a href="index.html" class="hover:text-brand-accent transition duration-300">Home</a>
                <a href="products.html" data-nav="products.html" class="hover:text-brand-accent transition duration-300">Products</a>
                <a href="index.html#bio" class="hover:text-brand-accent transition duration-300">Bio</a>
                <a href="index.html#contact" class="hover:text-brand-accent transition duration-300">Contact</a>
                <div class="flex items-center gap-4 sm:gap-5 pl-4 sm:pl-6 border-l border-black/20">
                    <a href="login.html" data-profile-link aria-label="Account" class="hover:text-brand-accent transition duration-300">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a>
                    <a href="cart.html" aria-label="View cart" class="relative inline-flex items-center hover:text-brand-accent transition duration-300">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="8" cy="21" r="1"></circle>
                            <circle cx="19" cy="21" r="1"></circle>
                            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
                        </svg>
                        <span data-cart-badge class="hidden absolute -top-2 -right-2 min-w-[16px] h-4 px-1 rounded-full bg-black text-white text-[10px] font-medium leading-4 text-center">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Product Detail -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-10 pb-24">
        <div class="grid md:grid-cols-2 gap-10 lg:gap-16">

            <!-- Gallery Column -->
            <div class="flex gap-4">
                <!-- Thumbnail rail (hidden when there's only one photo) -->
                <div id="thumb-rail" class="hidden flex-col gap-3 w-20 flex-shrink-0"></div>

                <!-- Main image with arrows -->
                <div class="relative bg-brand-grey flex-1 aspect-square overflow-hidden">
                    <img id="main-image" src="" alt="" class="absolute inset-0 w-full h-full object-contain">
                    <button id="prev-arrow" aria-label="Previous image" class="hidden absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white shadow items-center justify-center hover:bg-brand-grey transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <button id="next-arrow" aria-label="Next image" class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white shadow items-center justify-center hover:bg-brand-grey transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>

            <!-- Info Column -->
            <div>
                <h1 id="product-name" class="text-3xl sm:text-4xl font-serif uppercase tracking-wide mb-2">&nbsp;</h1>
                <p id="product-price" class="text-xl font-medium mb-2">&nbsp;</p>
                <p class="text-sm text-brand-accent mb-8">Colour: <span id="color-label"></span></p>

                <!-- Other colours -->
                <div class="mb-8">
                    <p class="text-sm font-medium tracking-wide mb-3">Other colours</p>
                    <div id="color-row" class="flex gap-3"></div>
                </div>

                <!-- Quantity -->
                <div class="mb-8">
                    <p class="text-sm font-medium tracking-wide mb-3">Quantity</p>
                    <div class="inline-flex items-center border border-black/20">
                        <button id="qty-minus" class="w-10 h-10 flex items-center justify-center hover:bg-brand-grey transition">&minus;</button>
                        <span id="qty-value" class="w-10 text-center text-sm">1</span>
                        <button id="qty-plus" class="w-10 h-10 flex items-center justify-center hover:bg-brand-grey transition">+</button>
                    </div>
                </div>

                <!-- CTA buttons -->
                <div class="flex gap-4 mb-8">
                    <button id="add-to-cart" class="add-to-cart-btn diagonal-close flex-1 border-2 border-black text-black py-3 text-sm tracking-widest uppercase font-medium" style="--diag-fill: #000000; --diag-color: #ffffff;">
                        Add to cart
                    </button>
                    <button id="buy-now" class="diagonal-close flex-1 bg-black text-white py-3 text-sm tracking-widest uppercase font-medium" style="--diag-fill: #ffffff; --diag-color: #000000;">
                        Buy it now
                    </button>
                </div>

                <p id="product-blurb" class="text-sm text-brand-accent leading-relaxed mb-8 border-t border-black/10 pt-6">&nbsp;</p>

                <!-- Accordion -->
                <div class="border-t border-black/10">
                    <div class="accordion-item border-b border-black/10">
                        <button class="accordion-toggle w-full flex justify-between items-center py-4 text-left">
                            <span class="font-serif uppercase tracking-wide">Description</span>
                            <svg class="accordion-chevron w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div class="accordion-panel">
                            <p id="product-description" class="text-sm text-brand-accent leading-relaxed pb-4"></p>
                        </div>
                    </div>
                    <div class="accordion-item border-b border-black/10">
                        <button class="accordion-toggle w-full flex justify-between items-center py-4 text-left">
                            <span class="font-serif uppercase tracking-wide">Shipping</span>
                            <svg class="accordion-chevron w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div class="accordion-panel">
                            <p class="text-sm text-brand-accent leading-relaxed pb-4">Free shipping on orders over $100 within Canada.</p>
                        </div>
                    </div>
                    <div class="accordion-item border-b border-black/10">
                        <button class="accordion-toggle w-full flex justify-between items-center py-4 text-left">
                            <span class="font-serif uppercase tracking-wide">Details</span>
                            <svg class="accordion-chevron w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div class="accordion-panel">
                            <p class="text-sm text-brand-accent leading-relaxed pb-4">Weight: 0.35 lb (0.16 kg)<br>Material: Nylon<br>Certification: ISO 14001<br>Dimensions: 32cm (L) &times; 13cm (H) &times; 3cm (D)</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Image zoom lightbox -->
    <div id="zoom-modal" class="fixed inset-0 z-50 items-center justify-center bg-black/90 p-6">
        <button id="zoom-close" aria-label="Close zoomed image" class="absolute top-6 right-6 text-white text-3xl leading-none hover:text-brand-accent transition">&times;</button>
        <img id="zoom-image" src="" alt="" class="max-w-full max-h-full object-contain cursor-zoom-out">
    </div>

    <script src="./assets/cart.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/inventory.js"></script>
    <script>
        // Mark the current page's nav link
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('nav a[data-nav]').forEach(a => {
                if (a.dataset.nav === path) a.classList.add('nav-current');
            });
        });

        // Product database — mirrors the cards on products.html
        const PRODUCTS = {
            1: {
                name: 'Cross-Body Bag — Black',
                price: 30,
                blurb: 'Compact cross-body bag, built for everyday carry.',
                images: ['./assets/bag-black.jpg', './assets/bag-black-front.jpg', './assets/bag-black-angle2.jpg', './assets/bag-black-dimensions.jpg'],
                colorName: 'Black'
            },
            2: {
                name: 'Cross-Body Bag — Grey',
                price: 30,
                blurb: 'Compact cross-body bag, built for everyday carry.',
                images: ['./assets/bag-grey.jpg'],
                colorName: 'Grey'
            },
            3: {
                name: 'Cross-Body Bag — Navy',
                price: 30,
                blurb: 'Compact cross-body bag, built for everyday carry.',
                images: ['./assets/bag-navy.jpg'],
                colorName: 'Navy'
            }
        };

        let state = { imgIndex: 0, qty: 1, soldOut: false };

        function getIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'), 10);
            return PRODUCTS[id] ? id : 1;
        }

        function render() {
            const id = getIdFromUrl();
            const product = PRODUCTS[id];

            document.title = 'Altus Gear - ' + product.name;
            document.getElementById('product-name').textContent = product.name;
            document.getElementById('product-price').textContent = '$' + product.price.toFixed(2);
            document.getElementById('color-label').textContent = product.colorName;
            document.getElementById('product-blurb').textContent = product.blurb;
            document.getElementById('product-description').textContent =
                'Equally at home on an outdoor excursion or a casual day out, this cross-body bag features a fully adjustable strap for a fit you can dial in, secured by a squeeze-release buckle for quick on-and-off wear. Its waterproof build keeps your essentials protected against rain, sweat, or splashes, so you can move from an active outing to everyday errands without missing a beat.';

            // Gallery: only show thumbnails/arrows if there's more than one photo
            const rail = document.getElementById('thumb-rail');
            const prevArrow = document.getElementById('prev-arrow');
            const nextArrow = document.getElementById('next-arrow');
            const hasMultiple = product.images.length > 1;
            rail.classList.toggle('hidden', !hasMultiple);
            rail.classList.toggle('flex', hasMultiple);
            prevArrow.classList.toggle('hidden', !hasMultiple);
            prevArrow.classList.toggle('flex', hasMultiple);
            nextArrow.classList.toggle('hidden', !hasMultiple);
            nextArrow.classList.toggle('flex', hasMultiple);

            rail.innerHTML = '';
            product.images.forEach((src, i) => {
                const btn = document.createElement('button');
                btn.className = 'thumb w-20 h-20 bg-brand-grey border-2 border-transparent overflow-hidden' + (i === state.imgIndex ? ' active' : '');
                btn.innerHTML = `<img src="${src}" class="w-full h-full object-contain" alt="${product.name} view ${i + 1}">`;
                btn.addEventListener('click', () => { state.imgIndex = i; render(); });
                rail.appendChild(btn);
            });

            document.getElementById('main-image').src = product.images[state.imgIndex];
            document.getElementById('main-image').alt = product.name;

            // Other colours — links to the sibling product pages
            const colorRow = document.getElementById('color-row');
            colorRow.innerHTML = '';
            Object.keys(PRODUCTS).forEach((pid) => {
                const p = PRODUCTS[pid];
                const link = document.createElement('a');
                link.href = `product.html?id=${pid}`;
                link.className = 'block w-9 h-9 rounded-full border border-black/10 overflow-hidden' + (Number(pid) === id ? ' color-dot active' : '');
                link.setAttribute('aria-label', p.colorName);
                link.innerHTML = `<img src="${p.images[0]}" class="w-full h-full object-cover" alt="${p.colorName}">`;
                colorRow.appendChild(link);
            });

            document.getElementById('qty-value').textContent = String(state.qty);

            // Sold out: lock both CTA buttons and swap their labels.
            // state.soldOut is resolved once (async, from Supabase) before
            // the first render — see DOMContentLoaded below.
            const addToCartBtn = document.getElementById('add-to-cart');
            const buyNowBtn = document.getElementById('buy-now');
            addToCartBtn.disabled = state.soldOut;
            buyNowBtn.disabled = state.soldOut;
            addToCartBtn.textContent = state.soldOut ? 'Sold out' : 'Add to cart';
            buyNowBtn.textContent = state.soldOut ? 'Sold out' : 'Buy it now';
        }

        document.addEventListener('DOMContentLoaded', () => {
            render();

            // Resolve sold-out status from Supabase without blocking the
            // initial paint; re-render once it's known.
            window.AltusInventory.isSoldOut(getIdFromUrl()).then((soldOut) => {
                state.soldOut = soldOut;
                render();
            });

            document.getElementById('prev-arrow').addEventListener('click', () => {
                const product = PRODUCTS[getIdFromUrl()];
                state.imgIndex = (state.imgIndex - 1 + product.images.length) % product.images.length;
                render();
            });
            document.getElementById('next-arrow').addEventListener('click', () => {
                const product = PRODUCTS[getIdFromUrl()];
                state.imgIndex = (state.imgIndex + 1) % product.images.length;
                render();
            });

            document.getElementById('qty-minus').addEventListener('click', () => {
                state.qty = Math.max(1, state.qty - 1);
                render();
            });
            document.getElementById('qty-plus').addEventListener('click', () => {
                state.qty = state.qty + 1;
                render();
            });

            document.getElementById('add-to-cart').addEventListener('click', function () {
                const btn = this;
                const id = getIdFromUrl();
                if (state.soldOut) return;
                const original = btn.textContent;
                const product = PRODUCTS[id];
                window.AltusCart.addItem({
                    id: id,
                    name: product.name,
                    price: product.price,
                    image: product.images[0],
                    color: product.colorName,
                    size: null,
                    qty: state.qty
                });
                btn.textContent = 'Added ✓';
                btn.classList.add('added');
                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove('added');
                }, 1400);
            });

            // Buy it now adds the item to the cart and hands off to cart.html,
            // where the shipping address is collected and shipping is priced —
            // checkout always starts from one place so that step can't be skipped.
            document.getElementById('buy-now').addEventListener('click', function () {
                const id = getIdFromUrl();
                if (state.soldOut) return;
                const product = PRODUCTS[id];
                window.AltusCart.addItem({
                    id: id,
                    name: product.name,
                    price: product.price,
                    image: product.images[0],
                    color: product.colorName,
                    size: null,
                    qty: state.qty
                });
                window.location.href = 'cart.html';
            });

            // Image zoom lightbox
            const zoomModal = document.getElementById('zoom-modal');
            const zoomImage = document.getElementById('zoom-image');
            const mainImage = document.getElementById('main-image');

            function openZoom() {
                zoomImage.src = mainImage.src;
                zoomImage.alt = mainImage.alt;
                zoomModal.classList.add('open');
            }
            function closeZoom() {
                zoomModal.classList.remove('open');
            }

            mainImage.addEventListener('click', openZoom);
            document.getElementById('zoom-close').addEventListener('click', closeZoom);
            zoomModal.addEventListener('click', (e) => { if (e.target === zoomModal) closeZoom(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeZoom(); });

            document.querySelectorAll('.accordion-toggle').forEach(toggle => {
                toggle.addEventListener('click', () => {
                    const panel = toggle.nextElementSibling;
                    const chevron = toggle.querySelector('.accordion-chevron');
                    const isOpen = panel.style.maxHeight && panel.style.maxHeight !== '0px';
                    document.querySelectorAll('.accordion-panel').forEach(p => p.style.maxHeight = '0px');
                    document.querySelectorAll('.accordion-chevron').forEach(c => c.style.transform = 'rotate(0deg)');
                    if (!isOpen) {
                        panel.style.maxHeight = panel.scrollHeight + 'px';
                        chevron.style.transform = 'rotate(180deg)';
                    }
                });
            });
        });
    </script>
</body>
</html>
