<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altus Gear - Products</title>
    <meta name="description" content="Shop Altus Gear cross-body bags — quality sportswear designed in North Vancouver.">
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="icon" href="./assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-black': '#000000',
                        'brand-white': '#ffffff',
                        'brand-grey': '#f2f2f2',
                        'brand-accent': '#8a8a8a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .nav-current {
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 6px;
        }
    </style>
</head>
<body class="font-sans bg-brand-white text-brand-black">

    <!-- Top Nav -->
    <nav class="sticky top-0 z-50 bg-brand-white border-b border-black/10">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-4 sm:px-6 py-4">
            <a href="index.html" class="flex items-center space-x-3">
                <img src="./assets/logo-mark.png" alt="Altus Gear Logo" class="w-8 h-8 object-contain invert">
                <span class="text-lg font-serif tracking-widest uppercase hidden md:block">ALTUS GEAR</span>
            </a>
            <div class="flex items-center space-x-6 sm:space-x-8 text-sm tracking-wider font-light">
                <a href="index.html" class="hover:text-brand-accent transition duration-300">Home</a>
                <a href="products.html" data-nav="products.html" class="hover:text-brand-accent transition duration-300">Products</a>
                <a href="index.html#bio" class="hover:text-brand-accent transition duration-300">Bio</a>
                <a href="index.html#contact" class="hover:text-brand-accent transition duration-300">Contact</a>
                <div class="flex items-center gap-4 sm:gap-5 pl-4 sm:pl-6 border-l border-black/20">
                    <a href="login.html" data-profile-link aria-label="Account" class="hover:text-brand-accent transition duration-300">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a>
                    <a href="cart.html" aria-label="View cart" class="relative inline-flex items-center hover:text-brand-accent transition duration-300">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="8" cy="21" r="1"></circle>
                            <circle cx="19" cy="21" r="1"></circle>
                            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
                        </svg>
                        <span data-cart-badge class="hidden absolute -top-2 -right-2 min-w-[16px] h-4 px-1 rounded-full bg-black text-white text-[10px] font-medium leading-4 text-center">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Product Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 gap-x-6 gap-y-12">

            <!-- Product 1 -->
            <a href="product.html?id=1" class="product-card group block" data-product-id="1" data-video-preview="assets/product-preview.mp4">
                <div class="relative bg-brand-grey aspect-square overflow-hidden">
                    <img src="./assets/bag-black.jpg" alt="Cross-Body Bag - Black" class="absolute inset-0 w-full h-full object-contain">
                    <span data-sold-out-badge class="hidden absolute top-2 left-2 bg-black text-white text-[10px] tracking-widest uppercase font-medium px-2 py-1">Sold Out</span>
                </div>
                <div class="mt-3 flex justify-between items-start text-sm">
                    <p class="font-medium">Cross-Body Bag — Black</p>
                    <p class="font-medium">$30</p>
                </div>
            </a>

            <!-- Product 2 -->
            <a href="product.html?id=2" class="product-card group block" data-product-id="2" data-video-preview="assets/product-preview.mp4">
                <div class="relative bg-brand-grey aspect-square overflow-hidden">
                    <img src="./assets/bag-grey.jpg" alt="Cross-Body Bag - Grey" class="absolute inset-0 w-full h-full object-contain">
                    <span data-sold-out-badge class="hidden absolute top-2 left-2 bg-black text-white text-[10px] tracking-widest uppercase font-medium px-2 py-1">Sold Out</span>
                </div>
                <div class="mt-3 flex justify-between items-start text-sm">
                    <p class="font-medium">Cross-Body Bag — Grey</p>
                    <p class="font-medium">$30</p>
                </div>
            </a>

            <!-- Product 3 -->
            <a href="product.html?id=3" class="product-card group block" data-product-id="3" data-video-preview="assets/product-preview.mp4">
                <div class="relative bg-brand-grey aspect-square overflow-hidden">
                    <img src="./assets/bag-navy.jpg" alt="Cross-Body Bag - Navy" class="absolute inset-0 w-full h-full object-contain">
                    <span data-sold-out-badge class="hidden absolute top-2 left-2 bg-black text-white text-[10px] tracking-widest uppercase font-medium px-2 py-1">Sold Out</span>
                </div>
                <div class="mt-3 flex justify-between items-start text-sm">
                    <p class="font-medium">Cross-Body Bag — Navy</p>
                    <p class="font-medium">$30</p>
                </div>
            </a>

        </div>
    </main>

    <script src="./assets/cart.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/inventory.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('nav a[data-nav]').forEach(a => {
                if (a.dataset.nav === path) a.classList.add('nav-current');
            });

            window.AltusInventory.getAll().then((stock) => {
                document.querySelectorAll('[data-product-id]').forEach((card) => {
                    const qty = stock[card.dataset.productId];
                    if (typeof qty === 'number' && qty <= 0) {
                        card.querySelector('[data-sold-out-badge]').classList.remove('hidden');
                    }
                });
            });
        });
    </script>
    <script src="assets/video-preview.js"></script>
</body>
</html>
